<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizMaster</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <div id="quizScreen">

            <h1>QuizMaster</h1>

            <div class="top-info">

                <span id="questionCounter">
                    Pergunta 1/15
                </span>

                <span id="timer">
                    20s
                </span>

            </div>

            <div class="progress-bar">

                <div id="progress"></div>

            </div>

            <h2 id="question">

            </h2>

            <div id="answers">

            </div>

        </div>

        <div id="resultScreen">

            <h1>Resultado</h1>

            <h2 id="finalScore">

            </h2>

            <p id="message">

            </p>

            <button id="restartBtn">

                Jogar Novamente

            </button>

            <div class="ranking">

                <h3>Melhor Pontuação</h3>

                <p id="bestScore">

                </p>

            </div>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
